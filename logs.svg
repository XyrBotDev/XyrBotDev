<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" rx="14" fill="#050505"/>

  <rect width="900" height="44" rx="14" fill="#151515"/>
  <circle cx="24" cy="22" r="7" fill="#ff3030"/>
  <circle cx="46" cy="22" r="7" fill="#ff3030"/>
  <circle cx="68" cy="22" r="7" fill="#ff3030"/>

  <text x="90" y="28"
