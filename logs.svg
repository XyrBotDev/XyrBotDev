<!-- TELEGRAM COLLISION BUTTON -->

<g>

  <!-- Left half -->
  <g>
    <rect x="-420" y="505"
          width="425" height="42"
          rx="8"
          fill="#229ED9"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 445 0; 445 0; 445 0"
      keyTimes="0;0.02;0.035;1"
      dur="38s"
      repeatCount="indefinite"/>
  </g>

  <!-- Right half -->
  <g>
    <rect x="895" y="505"
          width="425" height="42"
          rx="8"
          fill="#229ED9"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-445 0;-445 0;-445 0"
      keyTimes="0;0.02;0.035;1"
      dur="38s"
      repeatCount="indefinite"/>
  </g>


  <!-- Final Telegram button -->

  <a href="https://t.me/SKY_XYR">

    <g opacity="0">

      <!-- Button appearance -->
      <animate attributeName="opacity"
        values="0;0;0;1;1;1;0"
        keyTimes="0;0.78;0.80;0.83;0.86;0.96;1"
        dur="38s"
        repeatCount="indefinite"/>

      <!-- Vibration after collision -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="
        0 0;
        0 0;
        0 0;
        -5 0;
        5 0;
        -4 0;
        4 0;
        -2 0;
        2 0;
        0 0;
        0 0"
        keyTimes="
        0;
        0.80;
        0.83;
        0.835;
        0.84;
        0.845;
        0.85;
        0.855;
        0.86;
        0.865;
        1"
        dur="38s"
        repeatCount="indefinite"/>

      <rect x="25" y="505"
            width="850"
            height="42"
            rx="8"
            fill="#229ED9"
            stroke="#52c7ff"
            stroke-width="2"/>

      <!-- Telegram logo -->
      <circle cx="55" cy="526"
              r="14"
              fill="#ffffff"/>

      <path d="M47 526 L64 519 L60 535 L56 530 L52 533 L53 528 Z"
            fill="#229ED9"/>

      <!-- Link INSIDE button -->
      <text x="82"
            y="532"
            fill="#ffffff"
            font-family="monospace"
            font-size="18"
            font-weight="bold">
        https://t.me/SKY_XYR
      </text>

    </g>

  </a>

</g>
