<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKY_XYR • Build Terminal</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Consolas,"Courier New",monospace;
}

.terminal{
    width:100%;
    max-width:900px;
    min-height:520px;
    background:#050505;
    border:1px solid #2a0000;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 35px rgba(255,0,0,.12);
}

.top{
    height:46px;
    background:#111;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:9px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ff2020;
}

.title{
    margin-left:12px;
    color:#ff3030;
    font-size:15px;
    font-weight:900;
}

.logs{
    padding:24px;
    color:#ff3030;
    font-size:17px;
    font-weight:800;
    line-height:1.9;
}

.line{
    opacity:0;
    transform:translateY(5px);
    animation:appear .25s forwards;
    white-space:pre-wrap;
}

@keyframes appear{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.error{
    color:#ff0000;
    text-shadow:0 0 8px rgba(255,0,0,.35);
}

.cursor{
    display:inline-block;
    width:9px;
    height:18px;
    background:#ff3030;
    vertical-align:middle;
    animation:blink .7s infinite;
}

@keyframes blink{
    50%{opacity:0}
}
</style>
</head>

<body>

<div class="terminal">

    <div class="top">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="title">SKY_XYR / BUILD TERMINAL</span>
    </div>

    <div class="logs" id="logs"></div>

</div>

<script>
const logs = [
    ["BUILDING... 85%", 0],
    ["Loading bot modules...", 2200],
    ["Resolving dependencies...", 4700],
    ["Initializing command handlers...", 7300],
    ["Checking configuration...", 10000],
    ["Compiling command handlers...", 12800],
    ["Running command tests...", 15700],
    ["Testing API connection...", 18500],
    ["BUILDING... 90%", 21500],
    ["Validating responses...", 24500],
    ["Optimizing bot processes...", 27800],
    ["Checking runtime environment...", 31200],
    ["BUILDING... 95%", 34700],
    ["Finalizing build...", 38200],
    ["Performing final checks...", 41800],
    ["BUILDING... 99%", 45500],
    ["ERROR FOUND [!]", 48500]
];

const container = document.getElementById("logs");

function currentTime(){
    const now = new Date();

    return now.toLocaleTimeString([], {
        hour12:false,
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
    });
}

logs.forEach(([message, delay]) => {

    setTimeout(() => {

        const line = document.createElement("div");

        line.className = "line";

        if(message.includes("ERROR")){
            line.classList.add("error");
        }

        line.innerHTML =
            "[" + currentTime() + "] " +
            message;

        container.appendChild(line);

        window.scrollTo({
            top:document.body.scrollHeight,
            behavior:"smooth"
        });

        if(message.includes("ERROR")){
            const cursor = document.createElement("span");
            cursor.className = "cursor";
            line.appendChild(cursor);
        }

    }, delay);

});
</script>

</body>
</html>
